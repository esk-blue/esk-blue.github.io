# .github/workflows/astro-deploy.yml
name: Deploy Astro Project to GitHub Pages

on:
  # main 브랜치에 푸시가 발생할 때마다 워크플로우 실행
  push:
    branches:
      - main
  # GitHub Actions 탭에서 수동으로 실행 가능하도록 설정
  workflow_dispatch:

# 배포에 필요한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
      
      # 2. Node.js 환경 설정
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      # 3. 의존성 설치
      - name: Install dependencies
        run: npm install
        
      # 4. Astro 빌드 실행 (npm run build 명령)
      - name: Build Astro project
        run: npm run build
        
      # 5. 빌드 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Astro가 빌드한 결과물(index.html 등)이 담긴 폴더입니다.
          path: ./dist
          
      # 6. GitHub Pages 배포 명령 실행
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
